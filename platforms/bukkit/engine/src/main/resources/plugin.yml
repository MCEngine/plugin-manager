name: ${name}
version: ${version}
main: ${main}
api-version: '${apiVersion}'
folia-supported: true
author: ${author}
description: Installs, updates and removes plugins from a central catalogue, on SpigotMC, PaperMC and Folia
commands:
  ${command}:
    description: Manage this server's plugins against a central catalogue
    usage: /${command} <status|servers|check|apply|report|register|pending>
    aliases: [${commandAlias}]
    permission: mcpluginmanager.admin

permissions:
  mcpluginmanager.admin:
    description: Install, update and remove plugins on this server
    # Operators only. This command installs code; it is not something to hand
    # out by default, and a server that wants to delegate it can grant the node.
    default: op
